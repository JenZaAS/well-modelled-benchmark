# Inputs of red_tspulse_quicktune per target (canonical names). DEPTH is always present; do not list it.
# Target-only: the model reads only the measured RHOB flanks of a gap (Task.target_observed). No other log is used.
# Whole-curve (missing_curve) tasks have no RHOB context: the model abstains (NaN).
name: red_tspulse_quicktune
licence: Apache-2.0
targets:
  RHOB:
    required: []
    optional: []
