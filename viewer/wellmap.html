<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Well completeness map</title>
<link rel="stylesheet" href="vendor/leaflet.css">
<style>
:root {
  --bg: #eef0ee;
  --panel: #ffffff;
  --ink: #1f1f1f;
  --muted: #5c5c5c;
  --line: #d5d5d3;
  --accent: #2b3a42;
  --red: #c0392b;
  --amber: #d28c00;
  --green: #2e7d32;
  --sidebar-w: 300px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
  font: 13px/1.4 "Segoe UI", system-ui, sans-serif; }
#app { display: flex; flex-direction: column; height: 100%; }
header {
  display: flex; align-items: baseline; gap: 16px;
  padding: 8px 14px; background: var(--panel); border-bottom: 1px solid var(--line);
  flex: 0 0 auto;
}
header h1 { font-size: 15px; font-weight: 650; margin: 0; letter-spacing: 0.01em; }
header .sub { color: var(--muted); font-size: 12px; }
#main { flex: 1 1 auto; display: flex; min-height: 0; }
#side {
  width: 300px; min-width: 240px; max-width: 380px;
  background: var(--panel); border-right: 1px solid var(--line);
  display: flex; flex-direction: column; min-height: 0;
}
#map { flex: 1 1 auto; min-width: 0; background: #cfd8d4; }
#plot {
  flex: 0 0 0; height: 0; background: var(--panel);
  border-top: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0;
  transition: none;
}
#plot.open { flex: 0 0 46%; height: 46%; }
#plot-head {
  display: flex; align-items: center; gap: 12px;
  padding: 4px 10px; border-bottom: 1px solid var(--line); flex: 0 0 auto;
}
#plot-head h2 { font-size: 13px; margin: 0; font-weight: 650; }
#plot-head .meta { color: var(--muted); font-size: 12px; }
#plot-head button { border: 1px solid var(--line); background: #fafafa;
  padding: 2px 8px; cursor: pointer; font: inherit; }
#plot-head #plot-close { margin-left: 0; }
#plot-head .range { display: flex; align-items: center; gap: 4px; margin-left: auto; color: var(--muted); font-size: 12px; }
#plot-head .range input { width: 64px; font: inherit; padding: 1px 4px; border: 1px solid var(--line); }
#plot-head button[aria-pressed="true"] { background: #dbeafe; border-color: #1d4ed8; font-weight: 600; }
#plot-canvas-wrap { flex: 1 1 auto; min-height: 0; position: relative; }
#plot-canvas-wrap canvas { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; }
#plot-canvas-wrap canvas.dragging { cursor: grabbing; }
.filters, .legend { padding: 8px 12px; border-bottom: 1px solid var(--line); }
.filters label { margin-right: 10px; white-space: nowrap; cursor: pointer; }
.legend .row, .swatch-row { display: flex; align-items: center; gap: 8px; margin: 3px 0; flex-wrap: nowrap; }
.dot { width: 11px; height: 11px; border-radius: 50%; display: inline-block; border: 1px solid #333; }
.dot.sq { border-radius: 1px; }
.dot.tri { width: 0; height: 0; border: 6px solid transparent; border-bottom-color: #333;
  background: none; border-radius: 0; }
.dot.dts { box-shadow: 0 0 0 2px #111; }
#table-wrap { flex: 1 1 auto; overflow: auto; min-height: 0; }
table { width: 100%; border-collapse: collapse; font-size: 12px; }
th, td { padding: 3px 8px; text-align: left; border-bottom: 1px solid #eee; white-space: nowrap; }
th { position: sticky; top: 0; background: #f7f7f6; cursor: pointer; font-weight: 600; }
tr:hover td { background: #f3f6f4; }
tr.active td { background: #e7eee8; }
td.num { text-align: right; font-variant-numeric: tabular-nums; }
td .c { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
.leaflet-tooltip.well-tip {
  background: #fff; border: 1px solid #bbb; border-radius: 2px;
  padding: 6px 8px; font: 12px/1.35 "Segoe UI", system-ui, sans-serif;
  box-shadow: 0 1px 4px rgba(0,0,0,.15); color: #222;
}
.leaflet-tooltip.well-tip br { line-height: 1.3; }
.leaflet-container { font: inherit; background: #d3ddd8; }
.leaflet-control-attribution { font-size: 10px; }
#credit-pop { display: none; }

#availability { color: var(--muted); font-size: 12px; }
#availability .missing { color: var(--red); margin-right: 10px; }
#availability .ok { color: var(--green); margin-right: 10px; }
#pick-wrap { display: none; padding: 8px 12px; border-bottom: 1px solid var(--line); }
#pick-wrap.visible { display: block; }
#pick-wrap button { font: inherit; cursor: pointer; padding: 4px 10px; }
#status-banner { padding: 6px 12px; background: #fff8e6; border-bottom: 1px solid var(--line); display: none; }
#status-banner.visible { display: block; }
#tabs { display: flex; gap: 2px; padding: 4px 14px 0; background: #dfe3e0; border-bottom: 1px solid var(--line); flex: 0 0 auto; }
#tabs button { font: inherit; font-weight: 600; padding: 5px 16px; border: 1px solid var(--line); border-bottom: 0;
  background: #eef0ee; color: var(--muted); cursor: pointer; }
#tabs button[aria-selected="true"] { background: var(--panel); color: var(--ink); }
#tabs button[aria-disabled="true"] { color: #777A75; cursor: not-allowed; }
.tab-pane { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; }
.tab-pane[hidden] { display: none !important; }
#tab-benchmark {
  --g: #157A54; --gbg: #D4EFDF; --o: #A56B0C; --obg: #F8E6C0; --p: #C03A32; --pbg: #F8D4D0;
  --card: #FFFCF7; --line: #DDD7CC; --ink: #1A1E23; --muted: #5C6570; --accent: #2C4A6E;
  overflow: auto; background: #F3F0EA; color: var(--ink);
}
#tab-benchmark .bm { padding: 8px clamp(14px, 2.2vw, 28px) 24px; }
#tab-benchmark .bm-bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 8px; }
#tab-benchmark .bm-bar select { font: inherit; padding: 1px 4px; max-width: 220px; }
#tab-benchmark .na { color: var(--muted); }
#tab-benchmark pre { background: #f4f4f2; padding: 8px 10px; border: 1px solid var(--line); }
#bm-plot-wrap { position: relative; height: 520px; border: 1px solid var(--line); background: #fff; }
#bm-plot-wrap canvas { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; }
#bm-plot-wrap canvas.dragging { cursor: grabbing; }
#bm-plot-wrap .bm-heat-tip { position: absolute; pointer-events: none; z-index: 2; padding: 5px 8px; font: 11px/1.4 sans-serif; color: #1f1f1f; background: rgba(255,255,255,0.96); border: 1px solid #bbb; border-radius: 4px; box-shadow: 0 1px 4px rgba(0,0,0,0.12); white-space: nowrap; }
#tab-benchmark .bm-bar button { font: inherit; padding: 1px 8px; cursor: pointer; }
#bm-note { color: var(--muted); margin: 4px 0; }
#tab-benchmark .bm-top { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px 16px; min-height: 84px; padding-bottom: 12px; }
#tab-benchmark .bm-title, #tab-benchmark .bm-meta, #tab-benchmark .bm-hw, #tab-benchmark .bm-picker, #tab-benchmark .bm-ctl {
  display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px;
}
#tab-benchmark .bm-title h2 { margin: 0; font-size: 22px; line-height: 1.2; letter-spacing: -.025em; }
#tab-benchmark .bm-sep { color: #8B929A; }
#tab-benchmark .bm-meta { color: var(--muted); font-size: 12px; margin-top: 3px; }
#tab-benchmark .bm-meta strong, #tab-benchmark .bm-meta code { font: inherit; font-weight: 700; color: var(--ink); }
#tab-benchmark .bm-hw { font-size: 11px; color: var(--muted); margin-top: 2px; }
#tab-benchmark .bm-hw b { background: #E7EBF0; color: var(--accent); border-radius: 4px; padding: 1px 6px; }
#tab-benchmark .bm-ctl { align-self: flex-start; gap: 8px 14px; }
#tab-benchmark .bm-picker-label, #tab-benchmark .bm-card h4 { font-size: 10.5px; font-weight: 750; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
#tab-benchmark [hidden] { display: none !important; }
#tab-benchmark .bm-seg { display: inline-flex; flex-wrap: wrap; background: #E8E3D9; border-radius: 8px; padding: 2px; }
#tab-benchmark .bm-seg button { font: inherit; font-weight: 650; padding: 5px 13px; border: 0; border-radius: 6px; background: none; color: var(--muted); cursor: pointer; }
#tab-benchmark .bm-seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px #0003; }
#tab-benchmark .bm-seg button:disabled { opacity: .55; cursor: not-allowed; }
#tab-benchmark .bm-i { font: inherit; font-weight: 700; border: 0; border-radius: 50%; width: 19px; height: 19px; padding: 0; background: #E7EBF0; color: var(--accent); cursor: pointer; }
#tab-benchmark .bm-run { display: block; margin: 0 0 10px; font-weight: 650; }
#tab-benchmark .bm-run select { font: inherit; max-width: min(420px, 90%); padding: 3px 6px; }
#tab-benchmark .bm-tipbox { background: #1F2933; color: var(--card); border-radius: 8px; padding: 11px 13px; margin: 0 0 10px; max-width: 410px; line-height: 1.5; }
#tab-benchmark .bm-sec { font-size: 14px; margin: 22px 0 6px; }
#tab-benchmark .bm-cards { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 10px; }
#tab-benchmark .bm-card, #tab-benchmark .bm-grid th, #tab-benchmark .bm-grid td { background: var(--card); border: 1px solid var(--line); border-radius: 10px; }
#tab-benchmark .bm-card { padding: 12px 14px; min-width: 0; }
#tab-benchmark .bm-cards .bm-card { min-height: 348px; }
#tab-benchmark .bm-card h3 { margin: 0; font-size: 15px; line-height: 1.22; letter-spacing: -.02em; }
#tab-benchmark .bm-card-head { min-height: 61px; }
#tab-benchmark .bm-dir { display: flex; flex-wrap: wrap; align-items: center; gap: 3px 6px; margin-top: 5px; color: var(--muted); font-size: 11.5px; font-weight: 650; }
#tab-benchmark .bm-dir b { border-radius: 8px; background: #E4EEF7; color: #1F4B73; padding: 1px 6px; font-size: 10.5px; }
#tab-benchmark .bm-r + .bm-r { margin-top: 7px; }
#tab-benchmark .bm-subdued { opacity: .53; }
#tab-benchmark .bm-picked:not(svg *) { background: #e4eef7; outline: 2px solid #32658a; outline-offset: 1px; border-radius: 4px; }
#tab-benchmark svg .bm-picked { filter: drop-shadow(0 0 2px #32658a); }
#tab-benchmark .bm-model-link { color: inherit; text-decoration: underline dotted; text-underline-offset: 3px; }
#tab-benchmark .bm-model-link:is(:hover, :focus-visible) { color: #1f4b73; text-decoration-style: solid; }
#tab-benchmark .bm-detail { max-width: 860px; margin: auto; }
#tab-benchmark [hidden] { display: none !important; }
#tab-benchmark .bm-architecture { display: flex; flex-wrap: wrap; gap: 12px; padding: 0; list-style: none; }
#tab-benchmark .bm-architecture li { flex: 1 1 160px; padding: 16px; border: 1px solid var(--line); border-top: 3px solid #32658a; border-radius: 8px; background: var(--card); }
#tab-benchmark .bm-architecture strong { display: block; color: #1f4b73; margin-bottom: 6px; }
#tab-benchmark .bm-figure { margin: 18px 0; padding: 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); }
#tab-benchmark .bm-figure h3 { margin: 0; }
#tab-benchmark .bm-figure svg { display: block; width: 100%; max-width: 600px; height: auto; margin: 12px auto; }
#tab-benchmark .bm-figure path { stroke: #32658a; stroke-width: 1.8; stroke-linejoin: round; fill: none; }
#tab-benchmark .bm-figure circle { fill: #236657; }
#tab-benchmark .bm-figure path.bm-estimate { stroke: #ac511d; stroke-width: 2.8; }
#tab-benchmark .bm-figure text { text-anchor: middle; fill: #193b54; font: 600 12px system-ui, sans-serif; }
#tab-benchmark .bm-figure figcaption { color: var(--muted); line-height: 1.5; }
#tab-benchmark .bm-r-head, #tab-benchmark .bm-r-track, #tab-benchmark .bm-dl { display: flex; align-items: center; gap: 6px; }
#tab-benchmark .bm-dl .bm-nm { margin-right: auto; }
#tab-benchmark .bm-r-head small { margin: 0 0 0 auto; }
#tab-benchmark .bm-r-track { margin-top: 3px; margin-left: 21px; }
#tab-benchmark .bm-rk { display: inline-grid; place-items: center; flex: 0 0 15px; width: 15px; height: 15px; border-radius: 50%; background: #ECE7DD; color: var(--muted); font-size: 10px; font-weight: 750; }
#tab-benchmark .bm-rk.first { color: #fff; background: var(--ink); }
#tab-benchmark .bm-nm { min-width: 0; overflow-wrap: anywhere; font-weight: 700; }
#tab-benchmark .bm-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; }
#tab-benchmark .bm-track { display: block; flex: 1; height: 11px; background: #EFEBE2; border-radius: 6px; overflow: hidden; }
#tab-benchmark .bm-track b { display: block; height: 100%; border-radius: inherit; background: var(--quality); }
#tab-benchmark .bm-track .muted { background: repeating-linear-gradient(45deg, #C8C5BD 0 4px, #EFEBE2 4px 6px); }
#tab-benchmark .bm-r small, #tab-benchmark .bm-ln small, #tab-benchmark .bm-dl small { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; white-space: nowrap; }
#tab-benchmark .bm-chip { display: inline-block; min-width: 42px; padding: 2px 6px; border-radius: 4px; background: var(--quality-bg); color: var(--quality); text-align: center; font-size: 9.5px; font-weight: 750; line-height: 1.15; letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; }
#tab-benchmark .good { --quality: var(--g); --quality-bg: var(--gbg); }
#tab-benchmark .ok { --quality: var(--o); --quality-bg: var(--obg); }
#tab-benchmark .poor { --quality: var(--p); --quality-bg: var(--pbg); }
#tab-benchmark .muted { --quality: var(--muted); --quality-bg: #E9E6DF; }
#tab-benchmark .bm-cal { position: relative; display: block; flex: 1; height: 13px; border-radius: 7px;
  background: linear-gradient(90deg, var(--pbg), var(--obg) 45%, var(--gbg) 67.5% 82.5%, var(--obg) 95%, var(--pbg));
  box-shadow: inset 0 0 0 1px #E2D8C8; }
#tab-benchmark .bm-cal i { position: absolute; }
#tab-benchmark .bm-cal-tick { top: -3px; bottom: -3px; border-left: 1px dashed var(--ink); }
#tab-benchmark .bm-cal-mk { box-sizing: border-box; width: 12px; height: 12px; top: 50%; border-radius: 50%; transform: translate(-50%, -50%); border: 2px solid #fff; box-shadow: 0 0 0 1px #0004; background: var(--quality); }
#tab-benchmark .bm-cal-row small { width: 82px; text-align: right; }
#tab-benchmark .bm-capscale { display: flex; justify-content: space-between; padding-left: 21px; margin-top: 4px; color: var(--muted); font-size: 9.5px; }
#tab-benchmark .bm-capscale b { color: var(--ink); }
#tab-benchmark .bm-cap-note { color: var(--muted); font-size: 10px; font-style: italic; margin: 2px 0 0 21px; }
#tab-benchmark .bm-dial { display: block; width: 100%; max-width: 280px; margin: 0 auto; }
#tab-benchmark .bm-dial path { stroke: var(--quality); }
#tab-benchmark .bm-zones { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; margin: 4px 0 6px; }
#tab-benchmark .bm-zones .bm-chip { font-size: 9px; text-transform: none; letter-spacing: 0; padding: 2px 4px; }
#tab-benchmark .bm-dials, #tab-benchmark .bm-models, #tab-benchmark .bm-leg { display: grid; gap: 4px; }
#tab-benchmark .bm-speed-note { color: var(--muted); font-size: 10.5px; text-align: center; margin-top: 5px; }
#tab-benchmark .bm-tradeoff { display: grid; grid-template-columns: minmax(0, 1fr) minmax(235px, 27%); gap: 12px; }
#tab-benchmark .bm-scatter { display: block; width: 100%; height: auto; }
#tab-benchmark .bm-scatter-note { margin: 8px 0 0; font-size: 12px; color: #333; }
#tab-benchmark .bm-example { display: none; margin: 8px 0 10px; padding: 8px 12px; border: 2px solid #b45309; background: #fff7ed; color: #7c2d12; font-weight: 700; letter-spacing: 0.01em; }
#tab-benchmark .bm-example[data-show="1"] { display: block; }
#tab-benchmark .bm-scatter-card h3 { display: inline; margin-right: 10px; }
#tab-benchmark .bm-card h4 { margin: 0 0 6px; }
#tab-benchmark .bm-models { margin-bottom: 12px; }
#tab-benchmark .bm-leg span { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 11.5px; }
#tab-benchmark .bm-leg svg { flex: 0 0 30px; }
#tab-benchmark .bm-scatter-ctl { display: flex; flex-wrap: wrap; gap: 12px; margin: 8px 0 4px; font-size: 12px; }
#tab-benchmark .bm-scatter-ctl select { margin-left: 4px; }
#tab-benchmark .bm-leg .bm-cbar-wrap { display: grid; gap: 3px; margin-bottom: 4px; }
#tab-benchmark .bm-leg .bm-cbar-wrap b { color: #1A1E23; font-size: 11.5px; }
#tab-benchmark .bm-cbar { display: block; height: 10px; border-radius: 5px; }
#tab-benchmark .bm-leg .bm-cbar-ends { display: flex; justify-content: space-between; gap: 6px; font-size: 10.5px; }
#tab-benchmark .bm-grid-wrap { overflow-x: auto; margin: 0 -5px; }
#tab-benchmark .bm-grid { width: 100%; table-layout: auto; border-collapse: separate; border-spacing: 5px 8px; }
#tab-benchmark .bm-grid th, #tab-benchmark .bm-grid td { position: static; text-align: left; vertical-align: middle; white-space: normal; padding: 9px 12px; }
#tab-benchmark .bm-grid th { cursor: default; }
#tab-benchmark .bm-grid thead th:first-child { width: 15%; min-width: 118px; background: none; border-color: transparent; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
#tab-benchmark .bm-grid th b, #tab-benchmark .bm-model { font-size: 16px; }
#tab-benchmark .bm-grid th .na { font-weight: 400; }
#tab-benchmark .bm-grid .bm-cell { min-width: 278px; height: 136px; }
#tab-benchmark .bm-ln { display: grid; grid-template-columns: 64px 15px minmax(30px, 1fr) 45px minmax(65px, auto); align-items: center; gap: 6px; min-height: 29px; }
#tab-benchmark .bm-ln > b { font-size: 11px; color: var(--muted); }
#tab-benchmark .bm-ln small { text-align: right; }
#tab-benchmark .bm-ln small i { display: block; font-size: 9.5px; font-style: normal; }
#tab-benchmark .bm-ln .bm-track { height: 9px; }
#tab-benchmark .bm-ln-speed { grid-template-columns: 85px auto 1fr; }
#tab-benchmark .bm-ln-speed small { font-weight: 700; color: var(--ink); }
@media (max-width: 1120px) {
  #tab-benchmark .bm-cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  #tab-benchmark .bm-cards .bm-card { min-height: 0; }
}
@media (max-width: 620px) {
  #tab-benchmark .bm-cards, #tab-benchmark .bm-tradeoff { grid-template-columns: minmax(0, 1fr); }
}
#tab-prediction { background: var(--panel); min-height: 0; }
#tab-prediction .pd { display: flex; flex: 1 1 auto; min-height: 0; height: 100%; }
/* Wide screens: controls | models (full height) | plot. Narrow screens stack the first two in one scrolling column. */
#tab-prediction .pd-left { display: flex; flex: 0 0 auto; min-height: 0; border-right: 1px solid var(--line); }
#tab-prediction .pd-side { flex: 0 0 260px; width: 260px; overflow-y: auto; padding: 8px 12px; display: flex; flex-direction: column; gap: 6px; min-height: 0; }
#tab-prediction .pd-modelcol { flex: 0 0 310px; width: 310px; padding: 8px 12px; border-left: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; min-height: 0; }
#tab-prediction .pd-side h3, #tab-prediction .pd-modelcol h3 { font-size: 12px; margin: 8px 0 2px; }
#tab-prediction .pd-modelcol h3 { margin-top: 2px; }
#tab-prediction .pd-mini #pd-map { height: clamp(170px, 34vh, 340px); border: 1px solid var(--line); background: #cfd8d4; }
#tab-prediction .pd-label { font-weight: 600; margin-top: 2px; }
#tab-prediction .pd-models { display: flex; flex-direction: column; gap: 2px; flex: 1 1 auto; overflow-y: auto; min-height: 10em; margin: 0 -4px; padding: 0 4px; }
#tab-prediction .pd-group summary { position: sticky; top: 0; z-index: 1; background: var(--panel); cursor: pointer; font-size: 11px; font-weight: 650;
  color: var(--muted); text-transform: uppercase; letter-spacing: .04em; padding: 4px 0 2px; border-bottom: 1px solid var(--line); }
#tab-prediction .pd-group[data-group="ok"] summary { color: var(--green); }
#tab-prediction .pd-model { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 0 6px; align-items: start; padding: 2px 0; cursor: pointer; }
#tab-prediction .pd-model input { margin: 2px 0 0; }
#tab-prediction .pd-model.off { color: var(--muted); cursor: default; }
#tab-prediction .pd-mtext { display: flex; flex-direction: column; min-width: 0; line-height: 1.3; }
#tab-prediction .pd-mname { overflow-wrap: anywhere; }
#tab-prediction .pd-mtext .na, #tab-prediction .pd-mtext .why.optin { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#tab-prediction .why.optin { font-family: Consolas, "SFMono-Regular", monospace; font-size: 10.5px; }
#tab-prediction .pd-best, #tab-prediction .pd-actions { flex-shrink: 0; }
#tab-prediction .pd-filters { flex-shrink: 0; display: flex; flex-direction: column; gap: 3px; font-size: 12px; }
#tab-prediction .pd-filters select { font: inherit; max-width: 170px; }
#tab-prediction .pd-splits { display: flex; flex-wrap: wrap; gap: 2px 8px; }
#tab-prediction .why { font-size: 11px; }
#tab-prediction .why.error { color: var(--red); }
#tab-prediction .na { color: var(--muted); font-size: 11px; }
#tab-prediction .pd-best { display: flex; flex-direction: column; gap: 3px; border-top: 1px solid var(--line); padding-top: 6px; }
#tab-prediction .pd-best select { font: inherit; max-width: 170px; }
#tab-prediction .pd-actions { display: flex; flex-direction: column; gap: 4px; }
#tab-prediction code { font-size: 11px; word-break: break-all; }
#tab-prediction #pd-run { font: inherit; font-weight: 600; padding: 4px 10px; cursor: pointer; }
@media (max-width: 1200px) {
  #tab-prediction .pd-left { flex-direction: column; width: 290px; overflow-y: auto; }
  #tab-prediction .pd-side, #tab-prediction .pd-modelcol { flex: none; width: auto; overflow: visible; }
  #tab-prediction .pd-modelcol { border-left: 0; border-top: 1px solid var(--line); }
  #tab-prediction .pd-models { flex: none; max-height: 26em; }
  #tab-prediction .pd-mini #pd-map { height: 170px; }
}
#tab-prediction .pd-more { display: flex; flex-wrap: wrap; gap: 4px 10px; }
#tab-prediction .pd-main { flex: 1 1 auto; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
#tab-prediction .pd-note { color: var(--muted); padding: 4px 10px; }
#tab-prediction .pd-legend { display: flex; flex-wrap: wrap; gap: 4px 16px; padding: 2px 10px; font-size: 12px; }
#tab-prediction .pd-legend i { display: inline-block; width: 10px; height: 10px; margin-right: 4px; }
#tab-prediction .pd-legend .err { color: var(--red); }
#pd-wrap { flex: 1 1 auto; min-height: 0; overflow-x: auto; overflow-y: hidden; position: relative; }
#pd-wrap canvas { display: block; }

</style>
</head>
<body>
<div id="app">
  <nav id="tabs" role="tablist"></nav>
  <div id="tab-viewer" class="tab-pane" role="tabpanel">
  <header>
    <h1>Well completeness map</h1>
    <div class="sub" id="header-sub"></div>
    <div class="sub" id="availability"></div>
  </header>
  <div id="status-banner"></div>
  <div id="main">
    <aside id="side">
      <div id="pick-wrap"><button type="button" id="pick-btn" title="Choose your local data folder">Pick data folder</button>
        <input id="pick-input" type="file" webkitdirectory directory multiple hidden>
      </div>
      <div class="filters" id="filters"></div>
      <div class="legend" id="legend"></div>
      <div id="table-wrap"><table id="well-table"></table></div>
    </aside>
    <div id="map"></div>
  </div>
  <div id="plot">
    <div id="plot-head">
      <h2 id="plot-title"></h2>
      <div class="meta" id="plot-meta"></div>
      <div class="range">
        <label for="zoom-min" title="Set the visible depth range in metres">Depth</label>
        <input id="zoom-min" type="text" inputmode="decimal" title="Top of the visible depth window in metres (press Enter to apply)">
        <label for="zoom-max" title="Bottom of the visible depth window in metres">–</label>
        <input id="zoom-max" type="text" inputmode="decimal" title="Bottom of the visible depth window in metres (press Enter to apply)">
        <button type="button" id="zoom-reset" title="Reset to the padded log or lithology interval (or double-click the plot)">Reset</button>
      </div>
      <div class="range" id="xscale-ctl" title="Until you choose a mode for all tracks, CALI and PEF use Auto and the other tracks use Standard. Values outside the scale are clipped at the track edge.">
        <label>X scale</label>
        <button type="button" id="xscale-auto" aria-pressed="false" title="Auto for all tracks: full-well P1-P99 (ignoring at least one sample at each end), plus 5% padding and round limits (decades for resistivity). Uses Standard when there are too few samples.">Auto</button>
        <button type="button" id="xscale-std" aria-pressed="false" title="Fixed scales for all tracks: GR 0-150 gAPI, resistivity 0.2-2000 log, RHOB 1.95-2.95, NPHI 0.45 to -0.15, DTC 140-40, DTS 240-40, CALI 6-16, PEF 0-10, porosity 0-0.5, VSH 0-1, SW 0-1.">Standard</button>
      </div>
      <div class="range" id="fill-ctl" title="Shade zone bands behind all tracks. The TOPS strip and top lines always show.">
        <label for="fill-src">Formation fill</label>
        <select id="fill-src"><option value="formation" selected>Formation</option><option value="group">Group</option><option value="off">Off</option></select>
      </div>
      <button type="button" id="plot-close" title="Close the log plot">Close</button>
    </div>
    <div id="plot-canvas-wrap"><canvas id="plot-canvas"></canvas></div>
  </div>
  </div>
  <div id="tab-benchmark" class="tab-pane" role="tabpanel" hidden></div>
  <div id="tab-prediction" class="tab-pane" role="tabpanel" hidden></div>
</div>
<script src="vendor/leaflet.js"></script>
<script src="plot_utils.js"></script>
<script src="plot_style.js"></script>
<script src="benchmark_quality.js"></script>
<script src="benchmark.js"></script>
<script src="well_filters.js"></script>
<script src="prediction.js"></script>
<script>
(async function () {
  const DATA = await loadPayload();
  let live = !!DATA.live;

  async function loadPayload() {
    if (window.WELLMAP_DATA && Array.isArray(window.WELLMAP_DATA.wells)) {
      return window.WELLMAP_DATA;
    }
    try {
      const r = await fetch("/api/map");
      if (r.ok) return await r.json();
    } catch (err) {
      /* file:// or server down */
    }
    return { datasets: [], wells: [], unplaced: [], lithology: {}, coast: {type:"FeatureCollection",features:[]}, live: false, offline: true };
  }

  function showAvailability() {
    const el = document.getElementById("availability");
    if (!el) return;
    const sets = DATA.datasets || [];
    if (!sets.length) { el.textContent = DATA.offline ? "No server — pick a data folder or run Launch viewer." : ""; return; }
    el.innerHTML = sets.map(d => {
      const cls = d.status === "available" || d.status === "available_no_wells" ? "ok" : "missing";
      const tag = (d.status === "available" || d.status === "available_no_wells") ? "available" : "not available";
      const note = d.note ? ` — ${d.note}` : "";
      const tip = cls === "ok"
        ? `Dataset found in your data folder${d.note ? ": " + d.note : ""}`
        : "This dataset was not found in your data folder";
      return `<span class="${cls}" title="${esc(tip)}">${esc(d.name)}: ${tag}${esc(note)}</span>`;
    }).join(" ");
  }

  function showPickerIfNeeded() {
    const wrap = document.getElementById("pick-wrap");
    if (!wrap) return;
    if (!DATA.offline) return;
    wrap.classList.add("visible");
    const btn = document.getElementById("pick-btn");
    const input = document.getElementById("pick-input");
    if (!btn || !input) return;
    btn.addEventListener("click", () => input.click());
    input.addEventListener("change", async () => {
      const files = [...(input.files || [])];
      const manifests = files.filter(f => /wells(\.manifest)?\.json$/i.test(f.webkitRelativePath.split('/').pop()));
      const banner = document.getElementById("status-banner");
      if (!manifests.length) {
        if (banner) { banner.textContent = "No wells.json found in that folder. Start the viewer with Launch viewer.bat (or .command / .sh) so logs can be read locally."; banner.classList.add("visible"); }
        return;
      }
      if (banner) { banner.textContent = "Folder picker can show wells.json locations only. For log plots, use Launch viewer so the local server can read the files."; banner.classList.add("visible"); }
    });
  }

  const PU = window.PlotUtils;
  const PS = window.WmbPlotStyle;
  function tracksForWell(w) {
    const names = Object.keys((w && w.c) || {});
    const tracks = PS
      ? PS.tracksFromNames(names, { includeEmptyCore: true })
      : [];
    tracks.push({ id: "lith", title: "LITH", lith: true, curves: [] });
    return tracks;
  }

  const SPLIT_TIPS = (typeof WmbWellFilters !== "undefined" && WmbWellFilters.SPLIT_TIPS) ? WmbWellFilters.SPLIT_TIPS : {
    train: "Wells with lithology labels used to train in the FORCE 2020 competition",
    leaderboard: "FORCE 2020 public test wells (scored on the open leaderboard during the competition)",
    hidden: "FORCE 2020 final blind test wells",
  };
  function splitTip(s) {
    if (typeof WmbWellFilters !== "undefined" && WmbWellFilters.splitTip) return WmbWellFilters.splitTip(s);
    return SPLIT_TIPS[String(s).toLowerCase()] || ("Wells in split: " + s);
  }

  const state = {
    splits: new Set(),
    datasets: new Set(),
    dtsOnly: false,
    sortKey: "overall",
    sortDir: -1,
    selected: null,
    markers: {},
  };

  function completenessColor(pct) {
    if (pct == null || isNaN(pct)) return "#888";
    if (pct < 60) return "#c0392b";
    if (pct <= 85) return "#d28c00";
    return "#2e7d32";
  }
  function shapeFor(split) {
    const s = (split || "").toLowerCase();
    if (s === "leaderboard") return "square";
    if (s === "hidden") return "triangle";
    return "circle";
  }
  function wellId(w) { return w.id || (w.dataset + "::" + w.name); }

  function markerSvg(w, size) {
    const fill = completenessColor(w.overall);
    const dts = w.has_dts;
    const stroke = dts ? "#111" : "#333";
    const sw = dts ? 2.4 : 1.2;
    const s = size || 16;
    const c = s / 2;
    const shape = shapeFor(w.split);
    let body = "";
    if (shape === "square") {
      body = `<rect x="3" y="3" width="${s-6}" height="${s-6}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"/>`;
    } else if (shape === "triangle") {
      body = `<polygon points="${c},2 ${s-2},${s-2} 2,${s-2}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"/>`;
    } else {
      body = `<circle cx="${c}" cy="${c}" r="${c-3}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"/>`;
    }
    return `<svg xmlns="http://www.w3.org/2000/svg" width="${s}" height="${s}" viewBox="0 0 ${s} ${s}">${body}</svg>`;
  }

  function tipHtml(w) {
    const curves = w.curves || {};
    const keys = ["GR","RDEP","RMED","CALI","RHOB","NPHI","PEF","DTC","DTS"];
    const lines = keys.map(k => `${k} ${curves[k] == null ? "—" : curves[k] + "%"}`).join(" · ");
    return `<strong>${esc(w.name)}</strong><br>${esc(w.dataset)} · ${esc(w.split || "")} · ${w.overall}%`
      + (w.has_dts ? " · DTS" : "")
      + `<br><span style="color:#555">${lines}</span>`;
  }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({
      "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"
    }[c]));
  }

  function filteredWells() {
    if (typeof WmbWellFilters !== "undefined") {
      return WmbWellFilters.filterWells(DATA.wells, {
        datasets: state.datasets,
        splits: state.splits,
        hasLog: state.dtsOnly ? "DTS" : "",
      });
    }
    return DATA.wells.filter(w => {
      if (state.splits.size && !state.splits.has(w.split || "")) return false;
      if (state.datasets.size && !state.datasets.has(w.dataset)) return false;
      if (state.dtsOnly && !w.has_dts) return false;
      return true;
    });
  }
  // Only wells with coordinates can be drawn on the map.
  function visibleWells() {
    return filteredWells().filter(w => w.lat != null && w.lon != null);
  }

  // ----- map -----
  DATA.wells = DATA.wells || [];
  DATA.datasets = DATA.datasets || [];

  if (typeof L === "undefined") {
    document.getElementById("header-sub").textContent = "Leaflet failed to load (vendor/leaflet.js).";
    return;
  }
  const map = L.map("map", { zoomControl: true, attributionControl: true });
  const tiles = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
    subdomains: "abc",
    maxZoom: 12,
  });
  let tilesOk = false;
  const coast = L.geoJSON(DATA.coast || { type: "FeatureCollection", features: [] }, {
    style: { color: "#5b6b63", weight: 1.2, opacity: 0.9, fill: false },
    interactive: false,
  });
  function showCoastFallback() {
    if (!tilesOk && !map.hasLayer(coast)) coast.addTo(map);
  }
  tiles.on("load", () => {
    tilesOk = true;
    if (map.hasLayer(coast)) map.removeLayer(coast);
  });
  tiles.on("tileerror", showCoastFallback);
  tiles.addTo(map);

  const markersLayer = L.layerGroup().addTo(map);

  function addMarkers() {
    markersLayer.clearLayers();
    state.markers = {};
    const vis = visibleWells();
    for (const w of vis) {
      const s = w.has_dts ? 18 : 16;
      const icon = L.divIcon({
        className: "well-icon",
        html: markerSvg(w, s),
        iconSize: [s, s],
        iconAnchor: [s/2, s/2],
        popupAnchor: [0, -s/2],
      });
      const m = L.marker([w.lat, w.lon], { icon, riseOnHover: true, title: w.name });
      m.bindTooltip(tipHtml(w), { className: "well-tip", sticky: true, direction: "top", opacity: 1 });
      m.on("click", () => selectWell(w, false));
      m.addTo(markersLayer);
      state.markers[wellId(w)] = m;
    }
    return vis;
  }

  function fitToMarkers(vis) {
    if (!vis.length) {
      map.setView([59.5, 3.2], 6);
      return;
    }
    const b = L.latLngBounds(vis.map(w => [w.lat, w.lon]));
    map.fitBounds(b.pad(0.12), { maxZoom: 8 });
  }

  // ----- filters / legend / table -----
  function unique(arr) { return [...new Set(arr)]; }

  function renderFilters() {
    const splits = unique(DATA.wells.map(w => w.split || "")).filter(Boolean);
    const datasets = unique(DATA.wells.map(w => w.dataset)).filter(Boolean);
    const el = document.getElementById("filters");
    let html = "";
    if (datasets.length > 1) {
      html += datasets.map(d =>
        `<label title="Show or hide wells from the ${esc(d)} dataset"><input type="checkbox" data-ds="${esc(d)}" checked> ${esc(d)}</label>`
      ).join("");
      html += "<br>";
    }
    html += splits.map(s =>
      `<label title="${esc(splitTip(s))}"><input type="checkbox" data-split="${esc(s)}" checked> ${esc(s)}</label>`
    ).join("");
    html += ` <label title="Only wells that have a shear-sonic (DTS) curve"><input type="checkbox" id="flt-dts"> has DTS</label>`;
    el.innerHTML = html;
    el.querySelectorAll("input[data-split]").forEach(inp => {
      inp.addEventListener("change", () => {
        state.splits = new Set([...el.querySelectorAll("input[data-split]:checked")].map(i => i.dataset.split));
        // if all checked, treat as no filter
        if (state.splits.size === splits.length) state.splits = new Set();
        refresh();
      });
    });
    el.querySelectorAll("input[data-ds]").forEach(inp => {
      inp.addEventListener("change", () => {
        state.datasets = new Set([...el.querySelectorAll("input[data-ds]:checked")].map(i => i.dataset.ds));
        if (state.datasets.size === datasets.length) state.datasets = new Set();
        refresh();
      });
    });
    el.querySelector("#flt-dts").addEventListener("change", e => {
      state.dtsOnly = e.target.checked;
      refresh();
    });
  }

  function renderLegend() {
    document.getElementById("legend").innerHTML = `
      <div class="swatch-row">
        <span class="dot" style="background:#c0392b" title="Completeness below 60% of standard log curves present"></span><span title="Completeness below 60% of standard log curves present">&lt;60%</span>
        <span class="dot" style="background:#d28c00" title="Completeness 60 to 85% of standard log curves present"></span><span title="Completeness 60 to 85% of standard log curves present">60–85%</span>
        <span class="dot" style="background:#2e7d32" title="Completeness above 85% of standard log curves present"></span><span title="Completeness above 85% of standard log curves present">&gt;85%</span>
      </div>
      <div class="swatch-row">
        <span title="${esc(SPLIT_TIPS.train)}"><span class="dot" style="background:#888"></span>train</span>
        <span title="${esc(SPLIT_TIPS.leaderboard)}"><span class="dot sq" style="background:#888"></span>leaderboard</span>
        <span title="${esc(SPLIT_TIPS.hidden)}"><span style="display:inline-block;width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:11px solid #888;vertical-align:middle"></span>&nbsp;hidden</span>
        <span title="Thick black outline: the well has a shear-sonic (DTS) curve"><span class="dot dts" style="background:#888;margin-left:8px"></span>DTS</span>
      </div>`;
  }

  function sortedVisible() {
    const vis = filteredWells().slice();
    const key = state.sortKey;
    const dir = state.sortDir;
    vis.sort((a, b) => {
      let va, vb;
      if (key === "name") { va = a.name; vb = b.name; }
      else if (key === "split") { va = a.split || ""; vb = b.split || ""; }
      else { va = a.overall; vb = b.overall; }
      if (va < vb) return -1 * dir;
      if (va > vb) return 1 * dir;
      return a.name < b.name ? -1 : a.name > b.name ? 1 : 0;
    });
    return vis;
  }

  function renderTable() {
    const vis = sortedVisible();
    const sel = state.selected ? wellId(state.selected) : null;
    const arrow = (k) => state.sortKey === k ? (state.sortDir < 0 ? " ▼" : " ▲") : "";
    let html = `<thead><tr>
      <th data-k="name" title="Wellbore name (click to sort)">Well${arrow("name")}</th>
      <th data-k="split" title="FORCE 2020 competition split (train / leaderboard / hidden); blank when a dataset has no split">Split${arrow("split")}</th>
      <th data-k="overall" title="Percent of standard log curves present for that well (higher is more complete)">%${arrow("overall")}</th>
    </tr></thead><tbody>`;
    for (const w of vis) {
      const id = wellId(w);
      html += `<tr data-id="${esc(id)}" class="${id===sel?"active":""}">
        <td><span class="c" style="background:${completenessColor(w.overall)}"></span>${esc(w.name)}${w.has_dts?" · DTS":""}${w.lat == null || w.lon == null ? ' <span title="no coordinates; not on the map">· unplaced</span>' : ""}</td>
        <td>${esc(w.split||"")}</td>
        <td class="num">${w.overall == null ? "" : w.overall}</td>
      </tr>`;
    }
    html += "</tbody>";
    const tbl = document.getElementById("well-table");
    tbl.innerHTML = html;
    tbl.querySelectorAll("th").forEach(th => {
      th.addEventListener("click", () => {
        const k = th.dataset.k;
        if (state.sortKey === k) state.sortDir *= -1;
        else { state.sortKey = k; state.sortDir = k === "name" ? 1 : -1; }
        renderTable();
      });
    });
    tbl.querySelectorAll("tbody tr").forEach(tr => {
      tr.addEventListener("click", () => {
        const w = DATA.wells.find(x => wellId(x) === tr.dataset.id);
        if (w) selectWell(w, true);
      });
    });
  }

  function refresh() {
    const vis = addMarkers();
    renderTable();
    const nUnplaced = filteredWells().length - vis.length;
    document.getElementById("header-sub").textContent =
      `${vis.length} wells on map` + (nUnplaced ? ` · ${nUnplaced} unplaced (listed in table)` : "");
  }

  // ----- log plot -----
  const plotEl = document.getElementById("plot");
  const canvas = document.getElementById("plot-canvas");
  const ctx = canvas.getContext("2d");

  function closePlot() {
    plotEl.classList.remove("open");
    state.selected = null;
    clearZoom();
    renderTable();
    setTimeout(() => map.invalidateSize(), 50);
  }
  document.getElementById("plot-close").addEventListener("click", closePlot);

  async function selectWell(w, pan) {
    if (state.selected !== w) clearZoom();
    state.selected = w;
    plotEl.classList.add("open");
    document.getElementById("plot-title").textContent = w.name;
    const bits = [w.dataset, w.split, w.overall != null ? w.overall + "%" : null, w.has_dts ? "DTS" : null, w.depth_units || "m"];
    document.getElementById("plot-meta").textContent = bits.filter(Boolean).join(" · ");
    renderTable();
    setTimeout(() => { map.invalidateSize(); if (pan && w.lat != null && w.lon != null) map.panTo([w.lat, w.lon]); drawPlot(); }, 40);
    if (history.replaceState) {
      const url = new URL(location.href);
      url.searchParams.set("well", w.name);
      history.replaceState(null, "", url);
    }
    if (live && w.logs_pending && !w._logLoading) {
      w._logLoading = true;
      drawPlot();
      try {
        const ds = w.dataset_key || w.dataset;
        const r = await fetch("/api/well?dataset=" + encodeURIComponent(ds) + "&well=" + encodeURIComponent(w.name));
        const logs = await r.json();
        if (logs.error) w._logError = logs.error;
        else {
          w.d = logs.d || [];
          w.c = logs.c || {};
          w.lith = logs.lith || null;
          if (logs.overall != null) w.overall = logs.overall;
          if (logs.curves) w.curves = logs.curves;
          if (logs.has_dts != null) w.has_dts = logs.has_dts;
          w.logs_pending = false;
        }
      } catch (err) {
        w._logError = String(err);
      }
      w._logLoading = false;
      if (state.selected === w) {
        const bits2 = [w.dataset, w.split, w.overall != null ? w.overall + "%" : null, w.has_dts ? "DTS" : null, w.depth_units || "m"];
        document.getElementById("plot-meta").textContent = bits2.filter(Boolean).join(" · ");
        renderTable();
        drawPlot();
      }
    }
  }

  function curvePresent(w, k) {
    const a = w.c && w.c[k];
    return Array.isArray(a) && a.some(v => v != null);
  }

  function medianStep(d) {
    if (!d) return PU.medianStep(d);
    if (d._step === undefined) Object.defineProperty(d, "_step", { value: PU.medianStep(d), enumerable: false, writable: true });
    return d._step;
  }

  // X scales: null = mixed default (Auto for CALI/PEF as before), else "auto" / "standard" for all tracks.
  let xMode = null;
  const DEFAULT_AUTO = (PS && PS.AUTO_DEFAULT) ? PS.AUTO_DEFAULT : new Set(["CALI", "PEF"]);

  function syncXScaleButtons() {
    document.getElementById("xscale-auto").setAttribute("aria-pressed", String(xMode === "auto"));
    document.getElementById("xscale-std").setAttribute("aria-pressed", String(xMode === "standard"));
  }
  function setXMode(m) { xMode = m; syncXScaleButtons(); drawPlot(); }
  document.getElementById("xscale-auto").addEventListener("click", () => setXMode("auto"));
  document.getElementById("xscale-std").addEventListener("click", () => setXMode("standard"));
  let fillSource = "formation";
  document.getElementById("fill-src").addEventListener("change", (e) => { fillSource = e.target.value; drawPlot(); });

  // Ranges and clip counts use the full well, cached by curve payload and scale mode.
  function effectiveTracks(w) {
    const srcKey = (w.c || {}) && (Object.keys(w.c || {}).join(",") + "|" + (w.formation ? "f" : "") + (w.group ? "g" : ""));
    if (!w._xScales || w._xScales.src !== srcKey) {
      Object.defineProperty(w, "_xScales", { value: { src: srcKey, modes: new Map() }, configurable: true });
    }
    const { modes } = w._xScales;
    if (modes.has(xMode)) return modes.get(xMode);
    const tracks = tracksForWell(w).map(t => {
      if (t.lith || !t.curves) return t;
      const log = !!t.log;
      return Object.assign({}, t, { curves: t.curves.map((c) => {
        const series = (w.c && w.c[c.k]) || [];
        const useAuto = PS ? PS.useAutoScale(c.canon || c.k, xMode) : (xMode === "auto" || (xMode === null && DEFAULT_AUTO.has(c.k)));
        const std = [c.xmin, c.xmax];
        const range = useAuto ? PU.autoValueRange(series, { std, log: log || !!c.log }) : { xmin: c.xmin, xmax: c.xmax };
        if (useAuto && PS) {
          const inc = PS.ensureIncreasingScale(c.canon || c.k, range.xmin, range.xmax);
          range.xmin = inc[0]; range.xmax = inc[1];
        }
        const clipped = PU.countOutside(series, range.xmin, range.xmax, log || !!c.log);
        return Object.assign({}, c, { xmin: range.xmin, xmax: range.xmax, clipped });
      })});
    });
    modes.set(xMode, tracks);
    return tracks;
  }

  function drawPlot() {
    const w = state.selected;
    if (!w || !plotEl.classList.contains("open")) return;
    zoom.geom = null;
    const wrap = canvas.parentElement;
    const W = wrap.clientWidth, H = wrap.clientHeight;
    if (W < 20 || H < 20) return;
    const dpr = window.devicePixelRatio || 1;
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    const depths = w.d || [];
    if (!depths.length) {
      ctx.fillStyle = "#666";
      ctx.font = "13px Segoe UI, system-ui, sans-serif";
      let msg = "No curve data";
      if (w._logLoading) msg = "Loading curves…";
      else if (w._logError) msg = "Could not load curves: " + w._logError;
      else if (w.logs_pending && live) msg = "Loading curves…";
      ctx.fillText(msg, 16, 24);
      return;
    }
    if (!zoom.win || zoom.well !== w) { zoom.well = w; zoom.win = depthExtent(w); }
    const dmin = zoom.win.min, dmax = zoom.win.max;
    const padTop = 58, padBot = 10, depthW = 52, lithW = 26, gap = 6;
    const plotTop = padTop, plotH = H - padTop - padBot;
    if (plotH <= 2) return;
    // always show the standard tracks even if empty, so missing data is visible as blank
    const shown = effectiveTracks(w).filter(t => t.lith || t.noData || t.required || (t.curves && t.curves.length));
    const nFlex = shown.filter(t => !t.lith).length;
    const innerW = W - depthW - 8 - (shown.some(t => t.lith) ? lithW + gap : 0) - gap * shown.length;
    const flexW = nFlex ? Math.max(60, innerW / nFlex) : 60;
    const yOf = (d) => plotTop + (d - dmin) / (dmax - dmin) * plotH;
    zoom.geom = { plotTop, plotH };
    syncRangeInputs();

    // depth track
    ctx.fillStyle = "#fff";
    ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = "#ddd";
    ctx.beginPath(); ctx.moveTo(depthW, plotTop); ctx.lineTo(depthW, plotTop+plotH); ctx.stroke();
    ctx.fillStyle = "#444";
    ctx.font = "11px Segoe UI, system-ui, sans-serif";
    ctx.textAlign = "right";
    ctx.textBaseline = "middle";
    ctx.fillText("m", depthW - 6, 12);
    const ticks = PS ? PS.depthTicks(dmin, dmax) : (function () {
      const step = PU.niceStep(dmax - dmin), out = [];
      for (let d = Math.ceil(dmin / step) * step; d <= dmax; d += step) out.push(d);
      return out;
    }());
    for (const d of ticks) {
      const y = yOf(d);
      ctx.strokeStyle = "#eee";
      ctx.beginPath(); ctx.moveTo(depthW, y); ctx.lineTo(W, y); ctx.stroke();
      ctx.fillStyle = "#444";
      ctx.fillText(String(Math.round(d * 100) / 100), depthW - 6, y);
    }

    const tops = PS ? PS.formationIntervals(w.d, w.formation || w.FORMATION, w.group || w.GROUP) : [];
    const stripW = tops.length ? 18 : 0;
    let x = depthW + gap;
    if (stripW) {
      ctx.fillStyle = "#444";
      ctx.textAlign = "left";
      ctx.textBaseline = "top";
      ctx.font = "10px Segoe UI, system-ui, sans-serif";
      ctx.fillText("TOPS", x + 1, 2);
      drawTrackBorder(x, plotTop, stripW, plotH);
      ctx.save();
      ctx.beginPath(); ctx.rect(x + 1, plotTop + 1, stripW - 2, plotH - 2); ctx.clip();
      for (const iv of tops) {
        const y1 = yOf(iv.top), y2 = yOf(iv.base);
        ctx.fillStyle = iv.color;
        ctx.fillRect(x + 1, Math.min(y1, y2), stripW - 2, Math.max(1, Math.abs(y2 - y1)));
      }
      ctx.restore();
      x += stripW + gap;
    }
    const tracksLeft = x;
    const fills = (PS && fillSource !== "off") ? PS.formationIntervals(w.d, w.formation || w.FORMATION, w.group || w.GROUP, fillSource) : [];
    if (fills.length && shown.length) {
      const span = shown.reduce((s, t) => s + (t.lith ? lithW : flexW) + gap, 0) - gap;
      PS.fillFormationBands(ctx, fills, tracksLeft, span, yOf, plotTop, plotH, PS.FORMATION_FILL_ALPHA);
    }
    for (const t of shown) {
      const tw = t.lith ? lithW : flexW;
      if (t.lith) {
        drawLith(w, x, tw, yOf, dmin, dmax, plotTop, plotH);
      } else if (t.noData || !(t.curves && t.curves.length)) {
        ctx.fillStyle = "#444";
        ctx.textAlign = "left";
        ctx.textBaseline = "top";
        ctx.font = "10px Segoe UI, system-ui, sans-serif";
        ctx.fillText(t.title || t.id, x + 3, 2);
        ctx.fillStyle = "#777";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("no data", x + tw / 2, plotTop + plotH / 2);
      } else {
        drawTrackHeader(t, x, tw, plotTop);
        drawCurves(w, t, x, tw, yOf, dmin, dmax, plotTop, plotH);
      }
      drawTrackBorder(x, plotTop, tw, plotH);
      x += tw + gap;
    }
    if (tops.length && PS) {
      ctx.save();
      ctx.fillStyle = PS.TOP_LINE;
      ctx.font = "10px Segoe UI, system-ui, sans-serif";
      ctx.textAlign = "left";
      ctx.textBaseline = "bottom";
      for (const iv of tops) {
        const y = yOf(iv.top);
        if (y < plotTop || y > plotTop + plotH) continue;
        PS.strokeTopLine(ctx, tracksLeft, x - gap, y);
        ctx.fillText(iv.name, tracksLeft + 2, y - 1);
      }
      ctx.restore();
    }
  }

  // ----- shared vertical zoom / pan -----
  const zoom = { well: null, win: null, geom: null, drag: null };

  function seriesList(w) {
    const list = [];
    if (w && w.c) Object.keys(w.c).forEach(k => list.push(w.c[k]));
    if (w && w.lith) list.push(w.lith);
    return list;
  }
  // Recorded depth index (may include empty header); used as the zoom/pan clamp.
  function recordedExtent(w) {
    const ext = PU.recordedExtent((w && w.d) || []);
    if (ext && ext.max > ext.min) return ext;
    if (ext) return { min: ext.min, max: ext.min + 1 };
    return { min: 0, max: 1 };
  }
  // Default / Reset window: padded interval that actually has log or lithology values.
  function depthExtent(w) {
    return PU.defaultWindow((w && w.d) || [], seriesList(w));
  }
  function minSpan(w, ext) {
    return PU.minSpanFor(medianStep(w.d), ext);
  }
  function clearZoom() {
    endDrag();
    zoom.well = zoom.win = zoom.geom = null;
    syncRangeInputs(true);
  }
  function resetZoom() { clearZoom(); drawPlot(); syncRangeInputs(true); }
  function setWindow(win) { zoom.win = win; zoom.well = state.selected; drawPlot(); }
  function depthAtEvent(e) {
    const rect = canvas.getBoundingClientRect();
    const g = zoom.geom;
    const f = (e.clientY - rect.top - g.plotTop) / g.plotH;
    return zoom.win.min + Math.min(1, Math.max(0, f)) * (zoom.win.max - zoom.win.min);
  }
  function syncRangeInputs(force = false) {
    const a = document.getElementById("zoom-min"), b = document.getElementById("zoom-max");
    if (force || document.activeElement !== a) a.value = zoom.win ? String(Math.round(zoom.win.min * 100) / 100) : "";
    if (force || document.activeElement !== b) b.value = zoom.win ? String(Math.round(zoom.win.max * 100) / 100) : "";
  }
  function applyRangeInputs() {
    const w = state.selected;
    if (!w || !(w.d || []).length) return;
    const ext = recordedExtent(w);
    const win = PU.parseRange(document.getElementById("zoom-min").value, document.getElementById("zoom-max").value,
      ext, minSpan(w, ext));
    if (win) setWindow(win);
    syncRangeInputs(true);
  }
  canvas.addEventListener("wheel", e => {
    const w = state.selected;
    if (!w || !zoom.win || !zoom.geom) return;
    e.preventDefault();
    const pixels = e.deltaY * (e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? zoom.geom.plotH : 1);
    const factor = Math.pow(1.0015, pixels);
    const ext = recordedExtent(w);
    setWindow(PU.zoomAt(zoom.win, ext, depthAtEvent(e), factor, minSpan(w, ext)));
  }, { passive: false });
  canvas.addEventListener("pointerdown", e => {
    if (!state.selected || !zoom.win || !zoom.geom || zoom.drag || e.button !== 0) return;
    zoom.drag = { id: e.pointerId, y: e.clientY, win: zoom.win };
    canvas.setPointerCapture(e.pointerId);
    canvas.classList.add("dragging");
  });
  canvas.addEventListener("pointermove", e => {
    if (!zoom.drag || zoom.drag.id !== e.pointerId || !zoom.geom) return;
    const w = state.selected;
    const span = zoom.drag.win.max - zoom.drag.win.min;
    const dd = -(e.clientY - zoom.drag.y) / zoom.geom.plotH * span;
    const ext = recordedExtent(w);
    setWindow(PU.panBy(zoom.drag.win, ext, dd, minSpan(w, ext)));
  });
  function endDrag(e) {
    if (!zoom.drag || (e && zoom.drag.id !== e.pointerId)) return;
    const { id } = zoom.drag;
    zoom.drag = null;
    canvas.classList.remove("dragging");
    if (canvas.hasPointerCapture(id)) canvas.releasePointerCapture(id);
  }
  canvas.addEventListener("pointerup", endDrag);
  canvas.addEventListener("pointercancel", endDrag);
  canvas.addEventListener("lostpointercapture", endDrag);
  canvas.addEventListener("dblclick", resetZoom);
  document.getElementById("zoom-reset").addEventListener("click", resetZoom);
  ["zoom-min", "zoom-max"].forEach(id => {
    const el = document.getElementById(id);
    el.addEventListener("keydown", e => { if (e.key === "Enter") applyRangeInputs(); });
    el.addEventListener("change", applyRangeInputs);
  });

  // Track header: title, per-curve unit (curve colour) and x-axis ticks; drawn outside the clip.
  function drawTrackHeader(track, x, tw, plotTop) {
    ctx.textAlign = "left";
    ctx.textBaseline = "top";
    ctx.font = "10px Segoe UI, system-ui, sans-serif";
    track.curves.forEach((c, i) => {
      ctx.fillStyle = c.color;
      const clipTxt = c.clipped ? ` · ${c.clipped} clipped` : "";
      ctx.fillText(`${c.k} ${c.unit}${clipTxt}`, x + 3, 2 + i * 11, tw - 6);
    });
    ctx.font = "9px Segoe UI, system-ui, sans-serif";
    track.curves.forEach((c, i) => {
      const ticks = PU.tickValues(c, track.log);
      const ty = 2 + 2 * 11 + 2 + i * 10;
      ctx.fillStyle = c.color;
      ticks.forEach((v, j) => {
        const xx = track.log ? PU.xScaleLog(v, c.xmin, c.xmax, x, tw) : PU.xScale(v, c.xmin, c.xmax, x, tw);
        if (xx == null) return;
        const lab = PU.formatTick(v);
        const wLab = ctx.measureText(lab).width;
        ctx.textAlign = "left";
        const tx = Math.min(Math.max(xx - wLab / 2, x + 1), x + tw - wLab - 1);
        ctx.fillText(lab, tx, ty);
      });
      if (i === 0) {
        ctx.strokeStyle = "#ccc";
        ticks.forEach(v => {
          const xx = track.log ? PU.xScaleLog(v, c.xmin, c.xmax, x, tw) : PU.xScale(v, c.xmin, c.xmax, x, tw);
          if (xx == null) return;
          ctx.beginPath(); ctx.moveTo(xx, plotTop - 4); ctx.lineTo(xx, plotTop); ctx.stroke();
        });
      }
    });
  }

  function drawTrackBorder(x, y, w, h) {
    ctx.strokeStyle = "#ccc";
    ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
  }

  function drawCurves(well, track, x, tw, yOf, dmin, dmax, plotTop, plotH) {
    const depths = well.d;
    const maxGap = medianStep(depths) * 2;
    const [i0, i1] = PU.visibleRange(depths, dmin, dmax);
    const rows = Math.max(1, Math.floor(plotH));
    const clip = PU.clipRect(x, plotTop, tw, plotH);
    ctx.save();
    ctx.beginPath();
    ctx.rect(clip.x, clip.y, clip.w, clip.h);
    ctx.clip();
    // faint vertical grid at the tick values
    ctx.strokeStyle = "#f0f0f0";
    PU.tickValues(track.curves[0], track.log).forEach(v => {
      const c0 = track.curves[0];
      const xx = track.log ? PU.xScaleLog(v, c0.xmin, c0.xmax, x, tw) : PU.xScale(v, c0.xmin, c0.xmax, x, tw);
      if (xx != null) { ctx.beginPath(); ctx.moveTo(xx, plotTop); ctx.lineTo(xx, plotTop + plotH); ctx.stroke(); }
    });
    const Xc = (c, v) => (track.log || c.log) ? PU.xScaleLog(v, c.xmin, c.xmax, x, tw) : PU.xScale(v, c.xmin, c.xmax, x, tw);
    if (PS && track.crossFill) {
      const cr = track.curves.find(c => (c.canon || c.k) === "RHOB");
      const cn = track.curves.find(c => (c.canon || c.k) === "NPHI");
      if (cr && cn) {
        const rv = (well.c && well.c[cr.k]) || [], nv = (well.c && well.c[cn.k]) || [];
        for (let i = i0; i < Math.min(i1, depths.length - 1); i++) {
          const kind = PS.densityNeutronFill(rv[i], nv[i], [cr.xmin, cr.xmax], [cn.xmin, cn.xmax]);
          if (!kind || !PS.fillPairOk(depths, i, maxGap / 2, [rv, nv], [false, false])) continue;
          const x1r = Xc(cr, rv[i]), x1n = Xc(cn, nv[i]), x2r = Xc(cr, rv[i + 1]), x2n = Xc(cn, nv[i + 1]);
          const y1 = yOf(depths[i]), y2 = yOf(depths[i + 1]);
          if (![x1r, x1n, x2r, x2n, y1, y2].every(Number.isFinite)) continue;
          ctx.fillStyle = kind === "yellow" ? PS.CROSS_YELLOW : PS.CROSS_GREY;
          ctx.beginPath();
          ctx.moveTo(x1r, y1); ctx.lineTo(x1n, y1); ctx.lineTo(x2n, y2); ctx.lineTo(x2r, y2);
          ctx.closePath(); ctx.fill();
        }
      }
    }
    for (const c of track.curves) {
      if (c.fillFrom == null || !c.fillColor) continue;
      const arr = (well.c && well.c[c.k]) || [];
      const x0 = Xc(c, c.fillFrom);
      if (!Number.isFinite(x0)) continue;
      ctx.fillStyle = c.fillColor;
      for (let i = i0; i < Math.min(i1, depths.length - 1); i++) {
        const x1 = Xc(c, arr[i]), x2 = Xc(c, arr[i + 1]), y1 = yOf(depths[i]), y2 = yOf(depths[i + 1]);
        if (![x1, x2, y1, y2].every(Number.isFinite) || !PS.fillPairOk(depths, i, maxGap / 2, [arr], [track.log || !!c.log])) continue;
        ctx.beginPath();
        ctx.moveTo(x0, y1); ctx.lineTo(x1, y1); ctx.lineTo(x2, y2); ctx.lineTo(x0, y2);
        ctx.closePath(); ctx.fill();
      }
    }
    for (const c of track.curves) {
      const arr = (well.c && well.c[c.k]) || [];
      ctx.strokeStyle = c.color;
      ctx.lineWidth = 1;
      ctx.setLineDash(c.dash || []);
      ctx.beginPath();
      const segs = PU.buildSegments(depths, arr, { log: track.log, maxGap, i0, i1 });
      for (const seg of segs) {
        const idx = PU.decimateRun(seg, depths, arr, dmin, dmax, rows);
        let started = false;
        for (const i of idx) {
          const xx = track.log ? PU.xScaleLog(arr[i], c.xmin, c.xmax, x, tw) : PU.xScale(arr[i], c.xmin, c.xmax, x, tw);
          if (!Number.isFinite(xx)) { started = false; continue; }
          const yy = yOf(depths[i]);
          if (started) ctx.lineTo(xx, yy); else ctx.moveTo(xx, yy);
          started = true;
        }
      }
      ctx.stroke();
      ctx.setLineDash([]);
    }
    ctx.restore();
  }

  function drawLith(well, x, tw, yOf, dmin, dmax, plotTop, plotH) {
    ctx.fillStyle = "#444";
    ctx.textAlign = "left";
    ctx.textBaseline = "top";
    ctx.font = "10px Segoe UI, system-ui, sans-serif";
    ctx.fillText("LITH", x + 2, 2);
    const scheme = (DATA.lithology && (DATA.lithology[well.lithology_scheme] || DATA.lithology.force2020)) || { codes: {} };
    const codes = scheme.codes || {};
    const depths = well.d;
    const lith = well.lith || [];
    const n = Math.min(depths.length, lith.length);
    ctx.save();
    ctx.beginPath();
    ctx.rect(x + 1, plotTop + 1, tw - 2, plotH - 2);
    ctx.clip();
    for (let i = 0; i < n; i++) {
      const code = lith[i];
      if (code == null) continue;
      if (depths[i] > dmax || (i + 1 < n && depths[i + 1] < dmin)) continue;
      const y1 = yOf(depths[i]);
      const y2 = yOf(i + 1 < n ? depths[i + 1] : depths[i] + 0.15);
      const info = codes[String(code)] || codes[code] || { color: "#999" };
      ctx.fillStyle = info.color;
      const top = Math.min(y1, y2), h = Math.max(1, Math.abs(y2 - y1) + 0.4);
      ctx.fillRect(x + 1, top, tw - 2, h);
    }
    ctx.restore();
  }

  window.addEventListener("resize", () => { map.invalidateSize(); drawPlot(); });
  if (window.ResizeObserver) {
    new ResizeObserver(() => { drawPlot(); }).observe(document.getElementById("plot-canvas-wrap"));
  }

  // ----- boot -----
  showAvailability();
  showPickerIfNeeded();
  const nAll = (DATA.wells || []).length;
  const nPlaced = (DATA.wells || []).filter(w => w.lat != null && w.lon != null).length;
  document.getElementById("header-sub").textContent = `${nPlaced} / ${nAll} wells`;
  renderFilters();
  renderLegend();
  const vis = addMarkers();
  fitToMarkers(vis);
  renderTable();

  function openFromUrl() {
    const u = new URL(location.href);
    let q = u.searchParams.get("well") || "";
    if (!q && location.hash && !WmbBenchmark.parseTabHash(location.hash, tabs.ids(), null)) {
      try {
        q = decodeURIComponent(location.hash.replace(/^#(?:well=)?/, ""));
      } catch (e) {
        return;
      }
    }
    if (!q) return;
    const match = DATA.wells.find(w => w.name === q || wellId(w) === q || wellId(w).endsWith("::" + q));
    if (match) selectWell(match, true);
  }

  // ----- tabs (add a tab = one register() call) -----
  const tabs = WmbBenchmark.createTabs({
    bar: document.getElementById("tabs"),
    defaultId: "viewer",
    onChange(id) {
      if (WmbBenchmark.parseTabHash(location.hash, [id], null) === id) return; // keep a Benchmark sub-view in the hash
      const hash = WmbBenchmark.tabHash(id);
      if (location.hash !== hash && history.replaceState) {
        const u = new URL(location.href);
        u.hash = hash;
        history.replaceState(null, "", u);
      }
    },
  });
  tabs.register({ id: "viewer", title: "Viewer", pane: document.getElementById("tab-viewer"),
    show() { map.invalidateSize(); drawPlot(); } });
  tabs.register({ id: "benchmark", title: "Benchmark", pane: document.getElementById("tab-benchmark"),
    show(pane) { WmbBenchmark.mount(pane, PU); } });
  tabs.register({ id: "prediction", title: "Prediction", pane: document.getElementById("tab-prediction"),
    show(pane) { WmbPrediction.mount(pane, { PU, L, DATA }); } });
  openFromUrl();
  tabs.select(WmbBenchmark.parseTabHash(location.hash, tabs.ids(), "viewer"));
  window.addEventListener("hashchange", () => {
    const id = WmbBenchmark.parseTabHash(location.hash, tabs.ids(), null);
    if (id) tabs.select(id);
  });
})();
</script>
</body>
</html>
