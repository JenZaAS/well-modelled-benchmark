# FORCE 2020 dataset mapping (official demo dataset).
# Raw files are not changed. The loader reads this file and returns canonical columns.
# Schema: see datasets/_template/mapping.yaml.

dataset:
  id: force2020
  name: FORCE 2020 well logs and lithofacies
  folder: FORCE2020
  n_wells: 118
  official_demo: true
  source:
    zenodo_record: "4351156"
    doi: "https://doi.org/10.5281/zenodo.4351156"
    zenodo_url: "https://zenodo.org/records/4351156"
    github_url: "https://github.com/bolgebrygg/Force-2020-Machine-Learning-competition"
    github_data_dir: "https://github.com/bolgebrygg/Force-2020-Machine-Learning-competition/tree/master/lithology_competition/data"
  licence:
    zenodo_record: "CC BY 4.0"
    # The Zenodo record is tagged CC BY 4.0. Its description says the original
    # well-log data come from the Norwegian government under "NOLD 2.0" (a typo
    # for NLOD 2.0). Lithofacies labels were hand-crafted for the competition
    # (Explocrowd). This NLOD-vs-CC-BY split is not fully resolved on the
    # record itself; document both and keep the credit line.
    original_well_logs: "NLOD 2.0"
    lithofacies_labels: "CC BY 4.0"
    credit: >-
      Bormann, P., Aursand, P., Dilib, F., Manral, S. and Dischington, P. (2020).
      FORCE 2020 Well well log and lithofacies dataset for machine learning
      competition. Zenodo. Also credit FORCE and the Norwegian Offshore
      Directorate (Sodir).
    citation: >-
      Bormann, P., Aursand, P., Dilib, F., Manral, S., & Dischington, P. (2020).
      FORCE 2020 Well well log and lithofacies dataset for machine learning
      competition [Dataset]. Zenodo. https://doi.org/10.5281/zenodo.4351156
    also_cite_github: true

checksums_file: checksums.sha256

files:
  # required: needed to load and to pass `python -m wmb.datasets --check force2020`
  - name: train.csv
    role: required
    split: train
    source: "Unzip train.zip from the official GitHub data folder (train.csv is not published as a loose file there)."
    sha256: f72eaa9d4d30b0990b553333baaac7d129f2a2c5bce96fd580b31592658641da
    size: 280485502
  - name: train.zip
    role: optional
    source: "https://github.com/bolgebrygg/Force-2020-Machine-Learning-competition/raw/master/lithology_competition/data/train.zip"
    sha256: e996c8466f2d0dc7116daa71485cc90c31fcfac6345a5bb33165026478b642e9
    size: 91653972
    note: "Same rows as train.csv, zipped. The check accepts a valid train.zip and will unzip it if train.csv is missing."
  - name: leaderboard_test_features.csv
    role: required
    split: leaderboard
    source: "https://github.com/bolgebrygg/Force-2020-Machine-Learning-competition/raw/master/lithology_competition/data/leaderboard_test_features.csv"
    sha256: 4688d93728feab7e86855b9315ddfc8b498387927954235f7dbbfa2216550781
    size: 31688732
  - name: leaderboard_test_target.csv
    role: required
    split: leaderboard
    source: "https://github.com/bolgebrygg/Force-2020-Machine-Learning-competition/raw/master/lithology_competition/data/leaderboard_test_target.csv"
    sha256: 4fe5e59809d98eb9b8b0a3836776bd52e5c7e63ffefa31476fa17011a27ef382
    size: 3694123
    note: "Lithology labels for the leaderboard wells. No confidence column."
  - name: hidden_test.csv
    role: required
    split: hidden
    source: "https://github.com/bolgebrygg/Force-2020-Machine-Learning-competition/raw/master/lithology_competition/data/hidden_test.csv"
    sha256: c75e817bfefcabd2bacdefd9e1c74dbd829d24543646bf0b85ef8fbf5c06f069
    size: 30292497
    note: "Official hidden / blind test. Labels are included in this public release."
  - name: penalty_matrix.npy
    role: recommended
    source: "https://github.com/bolgebrygg/Force-2020-Machine-Learning-competition/raw/master/lithology_competition/data/penalty_matrix.npy"
    sha256: c312481af94d3557616b7ed79b5d1a12afee380fd471188785ab31874f159d43
    size: 1280
    note: "Official lithology scoring penalty matrix."
  - name: LAS_files_Force_2020_all_wells_train_test_blind_hidden_final.zip
    role: optional
    source: "https://zenodo.org/records/4351156/files/LAS_files_Force_2020_all_wells_train_test_blind_hidden_final.zip?download=1"
    sha256: 042ef1d473100dc12768cae7107a8cead071a394f137af3bc1ddaf8a5d1b8dda
    size: 169785172
    note: "118 LAS 2.0 files, same wells as the CSVs. Not required by the CSV loader."
  - name: "lithology scoring matrix cost function.xlsx"
    role: optional
    source: "https://zenodo.org/records/4351156/files/lithology%20scoring%20matrix%20cost%20function.xlsx?download=1"
    sha256: 23c1bcec3454e2620aaa76ed145fa5363015afa4ccafabfb0bece64f18b3735d
