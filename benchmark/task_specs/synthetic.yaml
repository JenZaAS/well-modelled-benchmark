# Task spec for the synthetic dataset (wmb.synthetic.make_wells). Used by the tests; no real data.
# Wells and gap windows below were generated once with `python -m benchmark.make_tasks --dataset synthetic --write-spec`
# and are used as given, so the tasks do not change if the placement code changes.
dataset: synthetic
seed: 2020
targets: [RHOB, DTC, DTS]
scenarios: [missing_curve, gap]
gap_lengths_m: [10, 50, 100]
synthetic: {n_wells: 8, n_samples: 1500, wells_seed: 0, test_fraction: 0.25, split_seed: 0}
train_wells: [SYN-01, SYN-02, SYN-03, SYN-04, SYN-05, SYN-07]
test_wells: [SYN-06, SYN-08]
