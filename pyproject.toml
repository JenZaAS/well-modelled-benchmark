[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wmb"
version = "0.1.0"
description = "well-modelled-benchmark: shared code for benchmarking missing-well-log prediction"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pandas>=2.0", "pyyaml>=6"]

[project.optional-dependencies]
las = ["lasio>=0.31"]
trees = ["scikit-learn>=1.4", "xgboost>=2.1", "lightgbm>=4.3"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"wmb.datasets" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
