    sha256: d36564dd821f892c58f35d1ef86fe4ca68422e133d1b9cc14cc1deb32461aeb6
    size: 27080
  - name: NPD_Lithostratigraphy_groups_all_wells.xlsx
    role: optional
    source: "https://zenodo.org/records/4351156/files/NPD_Lithostratigraphy_groups_all_wells.xlsx?download=1"
    sha256: f0be5f3061aa0e63b8692f71264635ccb7d52cb148b00beaf7a59cd495c49025
    size: 80797
  - name: NPD_Lithostratigraphy_member_formations_all_wells.xlsx
    role: optional
    source: "https://zenodo.org/records/4351156/files/NPD_Lithostratigraphy_member_formations_all_wells.xlsx?download=1"
    sha256: 2dd953073c459db341e6cf3243a9dbfa5a46b4bb567dddcaec2a1db4e5879518
    size: 168501

csv:
  delimiter: ";"
  encoding: utf-8
  null_value: -999.25
  # Official CSVs also use empty fields / NaN for missing values. The loader
  # treats both NaN and the sentinel list in wmb.io.SENTINELS as missing.
  well_id_column: WELL
  depth_column: DEPTH_MD
  depth_unit: m
  coordinate_columns:
    X_LOC: "UTM X coordinate (metres). Official starter notebook; UTM zone / EPSG is not stated in the files."
    Y_LOC: "UTM Y coordinate (metres). Official starter notebook; UTM zone / EPSG is not stated in the files."
    Z_LOC: "Z coordinate in metres (negative in the files; TVD-like)."
  group_column: GROUP
  formation_column: FORMATION
  lithology:
    lithology_column: FORCE_2020_LITHOFACIES_LITHOLOGY
    canonical_name: LITH
    confidence_column: FORCE_2020_LITHOFACIES_CONFIDENCE
    confidence_canonical_name: LITH_CONF
    confidence_codes:
      1: high
      2: medium
      3: low
    codes:
      30000: Sandstone
      65030: Sandstone/Shale
      65000: Shale
      80000: Marl
      74000: Dolomite
      70000: Limestone
      70032: Chalk
      88000: Halite
      86000: Anhydrite
      99000: Tuff
      90000: Coal
      93000: Basement
    code_source: "Official FORCE 2020 starter notebook (lithology_competition/data/starter_notebook.ipynb)."

splits:
  train:
    file: train.csv
    n_wells: 98
    labels: true
  leaderboard:
    features_file: leaderboard_test_features.csv
    target_file: leaderboard_test_target.csv
    n_wells: 10
    labels: true
    note: "Official leaderboard test. Features have no lithology columns; labels are in the target file (no confidence)."
  hidden:
    file: hidden_test.csv
    n_wells: 10
    labels: true
    note: "Official hidden / blind test. Labels are included in this public release."

# Raw contest names already match the canonical dictionary. Units need no conversion.
# First listed alias is the column name in the CSV / LAS.
columns:
  DEPTH: {column: DEPTH_MD, unit: m, canonical: DEPTH}
  GR:    {column: GR,   unit: gAPI,  canonical: GR}
  RDEP:  {column: RDEP, unit: ohm.m, canonical: RDEP}
  RMED:  {column: RMED, unit: ohm.m, canonical: RMED}
  CALI:  {column: CALI, unit: in,    canonical: CALI}
  RHOB:  {column: RHOB, unit: g/cm3, canonical: RHOB}
  NPHI:  {column: NPHI, unit: v/v,   canonical: NPHI, file_unit: m3/m3, note: "m3/m3 is fraction, already v/v. Do not divide by 100."}
  PEF:   {column: PEF,  unit: b/e,   canonical: PEF}
  DTC:   {column: DTC,  unit: us/ft, canonical: DTC}
  DTS:   {column: DTS,  unit: us/ft, canonical: DTS}
  LITH:  {column: FORCE_2020_LITHOFACIES_LITHOLOGY, canonical: LITH}
  LITH_CONF: {column: FORCE_2020_LITHOFACIES_CONFIDENCE, canonical: LITH_CONF}

# Present in the CSVs but not mapped to a core curve. The loader may keep them
# on Well.meta["extra"] if requested; they are not required.
extra_columns: [RSHA, SGR, SP, BS, ROP, DCAL, DRHO, MUDWEIGHT, RMIC, ROPA, RXO]

quirks:
  - "Names and units are already uniform. No mnemonic aliasing is needed."
  - "NPHI is a fraction (m3/m3), not percent."
  - "RMED has no valid samples in train well 34/10-33. CALI has no valid samples in train well 35/8-4."
  - "DTS is present in 46 of 118 wells (32 train, 6 leaderboard, 8 hidden). PEF is present in 88 of 118 wells (69 train, 10 leaderboard, 9 hidden). Presence means at least one valid sample."
  - "PEF has values well above the 20 b/e guardrail (about 23,760 samples in 49 wells, max about 383). Flag them; do not change the files."
  - "A smaller number of spikes fall outside the other guardrails (DTS > 500 us/ft in 6 wells, plus a few DTC, NPHI, GR, CALI, RHOB and RMED samples). Flag, do not edit."
  - "Soft North Sea shales can have DTS medians around 290-370 us/ft; that is still us/ft, not a unit error."
  - "The contest CSVs are semicolon-separated."
  - "Logs were slightly cleaned and partially despiked by the competition organisers."
  - "wells.json is not part of the official download."
