# Inputs of red_moment per target (canonical names). DEPTH is always present; do not list it.
# No log is required: the depth adapter uses visible target flanks (gap) or training
# demonstrations (missing_curve). Other core logs are optional (accepted but unused).
name: red_moment
licence: MIT
targets:
  RHOB:
    required: []
    optional: [GR, RDEP, RMED, CALI, NPHI, PEF, DTC, DTS]
  DTC:
    required: []
    optional: [GR, RDEP, RMED, CALI, RHOB, NPHI, PEF, DTS]
  DTS:
    required: []
    optional: [GR, RDEP, RMED, CALI, RHOB, NPHI, PEF, DTC]
